name: Android-APK bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Protokoll gegen echten Mitschnitt)
        run: node test/replay.test.js

      - name: Web-Dateien in die App kopieren
        run: sh android/sync-web.sh

      - name: APK bauen
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gekoo-controller.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gekoo-controller-apk
          path: gekoo-controller.apk

      - name: Release mit APK (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gekoo-controller.apk
